name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + bundle
        run: npm run dist

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Informational supply-chain scan. Non-blocking: existing advisories are
      # transitive (in code paths we don't invoke) and are handled by upstream
      # bumps via dependabot; this surfaces NEW high/critical issues in the log.
      - name: Audit (informational)
        run: npm audit --audit-level=high || true
